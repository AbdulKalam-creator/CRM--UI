<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details Form - B2B CRM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <header class="form-header">
                <h1>Customer Details</h1>
                <p>Please fill in your information below</p>
            </header>

            <form id="customerForm" class="customer-form">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName" class="required">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- Mobile Number with Country Code -->
                <div class="form-group">
                    <label for="mobileNumber" class="required">Mobile Number</label>
                    <div class="phone-input-group">
                        <select id="countryCode" name="countryCode" class="country-code" required>
                            <option value="">Code</option>
                            <option value="+1">+1 (US/CA)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+91" selected>+91 (India)</option>
                            <option value="+971">+971 (UAE)</option>
                            <option value="+966">+966 (Saudi)</option>
                            <option value="+65">+65 (Singapore)</option>
                            <option value="+61">+61 (Australia)</option>
                            <option value="+86">+86 (China)</option>
                            <option value="+81">+81 (Japan)</option>
                            <option value="+49">+49 (Germany)</option>
                            <option value="+33">+33 (France)</option>
                            <option value="+39">+39 (Italy)</option>
                            <option value="+34">+34 (Spain)</option>
                            <option value="+7">+7 (Russia)</option>
                            <option value="+55">+55 (Brazil)</option>
                            <option value="+52">+52 (Mexico)</option>
                            <option value="+27">+27 (South Africa)</option>
                            <option value="+82">+82 (South Korea)</option>
                            <option value="+60">+60 (Malaysia)</option>
                            <option value="+62">+62 (Indonesia)</option>
                            <option value="+66">+66 (Thailand)</option>
                            <option value="+84">+84 (Vietnam)</option>
                            <option value="+63">+63 (Philippines)</option>
                        </select>
                        <input 
                            type="tel" 
                            id="mobileNumber" 
                            name="mobileNumber" 
                            placeholder="Enter mobile number"
                            pattern="[0-9]{10,15}"
                            required
                        >
                    </div>
                </div>

                <!-- Email ID -->
                <div class="form-group">
                    <label for="email" class="required">Email ID</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <!-- Budget Range -->
                <div class="form-group">
                    <label for="budgetRange" class="required">Budget Range</label>
                    <select id="budgetRange" name="budgetRange" required>
                        <option value="">Select budget range</option>
                        <option value="under-25">Under ₹25 Lakhs</option>
                        <option value="25-50">₹25 Lakhs - ₹50 Lakhs</option>
                        <option value="50-75">₹50 Lakhs - ₹75 Lakhs</option>
                        <option value="75-100">₹75 Lakhs - ₹1 Crore</option>
                        <option value="1-2">₹1 Crore - ₹2 Crores</option>
                        <option value="2-5">₹2 Crores - ₹5 Crores</option>
                        <option value="5-10">₹5 Crores - ₹10 Crores</option>
                        <option value="above-10">Above ₹10 Crores</option>
                    </select>
                </div>

                <!-- Preferred Location -->
                <div class="form-group">
                    <label for="preferredLocation" class="required">Preferred Location</label>
                    <input 
                        type="text" 
                        id="preferredLocation" 
                        name="preferredLocation" 
                        placeholder="Enter preferred location"
                        required
                    >
                </div>

                <!-- From Location (Current City) -->
                <div class="form-group">
                    <label for="fromLocation" class="required">From Location (Current City)</label>
                    <input 
                        type="text" 
                        id="fromLocation" 
                        name="fromLocation" 
                        placeholder="Enter your current city"
                        required
                    >
                </div>

                <!-- Property Interested -->
                <div class="form-group">
                    <label for="propertyInterested" class="required">Property Interested</label>
                    <input 
                        type="text" 
                        id="propertyInterested" 
                        name="propertyInterested" 
                        placeholder="Enter specific project / property name"
                        required
                    >
                </div>

                <!-- Property Type -->
                <div class="form-group">
                    <label for="propertyType" class="required">Property Type</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="propertyType" value="apartment" required>
                            <span>Apartment</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="propertyType" value="villa" required>
                            <span>Villa</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="propertyType" value="plot" required>
                            <span>Plot</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="propertyType" value="commercial" required>
                            <span>Commercial</span>
                        </label>
                    </div>
                </div>

                <!-- Preferred Configuration (Conditional - Only for Apartment/Villa) -->
                <div class="form-group" id="preferredConfigGroup" style="display: none;">
                    <label for="preferredConfiguration" class="required">Preferred Configuration</label>
                    <select id="preferredConfiguration" name="preferredConfiguration">
                        <option value="">Select configuration</option>
                        <option value="1-bhk">1 BHK</option>
                        <option value="2-bhk">2 BHK</option>
                        <option value="3-bhk">3 BHK</option>
                        <option value="4-bhk">4 BHK</option>
                    </select>
                </div>

                <!-- Purpose of Purchase -->
                <div class="form-group">
                    <label for="purposeOfPurchase" class="required">Purpose of Purchase</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="purposeOfPurchase" value="self-use" required>
                            <span>Self-use</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="purposeOfPurchase" value="investment" required>
                            <span>Investment</span>
                        </label>
                    </div>
                </div>

                <!-- Purchase Timeline -->
                <div class="form-group">
                    <label for="purchaseTimeline" class="required">Purchase Timeline</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="purchaseTimeline" value="immediate" required>
                            <span>Immediate (0–1 month)</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="purchaseTimeline" value="1-3-months" required>
                            <span>1–3 months</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="purchaseTimeline" value="3-6-months" required>
                            <span>3–6 months</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="purchaseTimeline" value="just-exploring" required>
                            <span>Just exploring</span>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-group">
                    <button type="submit" class="submit-btn">Submit Details</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
