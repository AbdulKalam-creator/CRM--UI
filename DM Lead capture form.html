<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details Form - B2B CRM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border-top: 4px solid #dc3545;
        }

        .form-header {
            background: #dc3545;
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .form-header h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        .form-header p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .form-body {
            padding: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px 24px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95rem;
        }

        .form-group label.required::after {
            content: " *";
            color: #dc3545;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.12);
        }

        .phone-input-group {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 10px;
        }

        .country-code {
            border-radius: 8px;
            border: 2px solid #e1e8ed;
            padding: 10px 12px;
            font-size: 0.95rem;
            background: #fff;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .radio-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #e1e8ed;
            background: #f8f9fa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-option input {
            accent-color: #dc3545;
        }

        .radio-option:hover {
            border-color: #dc3545;
            background: rgba(220, 53, 69, 0.04);
        }

        .form-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .submit-btn {
            background: #dc3545;
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background: #c82333;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(220, 53, 69, 0.35);
        }

        .helper-text {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .form-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .phone-input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <header class="form-header">
            <div class="form-header-left">
                <div class="form-header-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div>
                    <h1>Customer Details</h1>
                    <p>Please fill in your information below</p>
                </div>
            </div>
        </header>

        <div class="form-body">
            <form id="customerForm" class="customer-form">
                <div class="form-grid">
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName" class="required">Full Name</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <!-- Mobile Number with Country Code -->
                    <div class="form-group">
                        <label for="mobileNumber" class="required">Mobile Number</label>
                        <div class="phone-input-group">
                            <select id="countryCode" name="countryCode" class="country-code" required>
                                <option value="">Code</option>
                                <option value="+1">+1 (US/CA)</option>
                                <option value="+44">+44 (UK)</option>
                                <option value="+91" selected>+91 (India)</option>
                                <option value="+971">+971 (UAE)</option>
                                <option value="+966">+966 (Saudi)</option>
                                <option value="+65">+65 (Singapore)</option>
                                <option value="+61">+61 (Australia)</option>
                                <option value="+86">+86 (China)</option>
                                <option value="+81">+81 (Japan)</option>
                                <option value="+49">+49 (Germany)</option>
                                <option value="+33">+33 (France)</option>
                                <option value="+39">+39 (Italy)</option>
                                <option value="+34">+34 (Spain)</option>
                                <option value="+7">+7 (Russia)</option>
                                <option value="+55">+55 (Brazil)</option>
                                <option value="+52">+52 (Mexico)</option>
                                <option value="+27">+27 (South Africa)</option>
                                <option value="+82">+82 (South Korea)</option>
                                <option value="+60">+60 (Malaysia)</option>
                                <option value="+62">+62 (Indonesia)</option>
                                <option value="+66">+66 (Thailand)</option>
                                <option value="+84">+84 (Vietnam)</option>
                                <option value="+63">+63 (Philippines)</option>
                            </select>
                            <input 
                                type="tel" 
                                id="mobileNumber" 
                                name="mobileNumber" 
                                placeholder="Enter mobile number"
                                pattern="[0-9]{10,15}"
                                required
                            >
                        </div>
                        <div class="helper-text">Include country code and a valid contact number.</div>
                    </div>

                    <!-- Email ID -->
                    <div class="form-group">
                        <label for="email" class="required">Email ID</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email address"
                            required
                        >
                    </div>

                    <!-- Budget Range -->
                    <div class="form-group">
                        <label for="budgetRange" class="required">Budget Range</label>
                        <select id="budgetRange" name="budgetRange" required>
                            <option value="">Select budget range</option>
                            <option value="under-25">Under ₹25 Lakhs</option>
                            <option value="25-50">₹25 Lakhs - ₹50 Lakhs</option>
                            <option value="50-75">₹50 Lakhs - ₹75 Lakhs</option>
                            <option value="75-100">₹75 Lakhs - ₹1 Crore</option>
                            <option value="1-2">₹1 Crore - ₹2 Crores</option>
                            <option value="2-5">₹2 Crores - ₹5 Crores</option>
                            <option value="5-10">₹5 Crores - ₹10 Crores</option>
                            <option value="above-10">Above ₹10 Crores</option>
                        </select>
                    </div>

                    <!-- Preferred Location -->
                    <div class="form-group">
                        <label for="preferredLocation" class="required">Preferred Location</label>
                        <input 
                            type="text" 
                            id="preferredLocation" 
                            name="preferredLocation" 
                            placeholder="Enter preferred location"
                            required
                        >
                    </div>

                    <!-- From Location (Current City) -->
                    <div class="form-group">
                        <label for="fromLocation" class="required">From Location (Current City)</label>
                        <input 
                            type="text" 
                            id="fromLocation" 
                            name="fromLocation" 
                            placeholder="Enter your current city"
                            required
                        >
                    </div>

                    <!-- Property Interested -->
                    <div class="form-group">
                        <label for="propertyInterested" class="required">Property Interested</label>
                        <input 
                            type="text" 
                            id="propertyInterested" 
                            name="propertyInterested" 
                            placeholder="Enter specific project / property name"
                            required
                        >
                    </div>

                    <!-- Property Type -->
                    <div class="form-group">
                        <label for="propertyType" class="required">Property Type</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="propertyType" value="apartment" required>
                                <span>Apartment</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="propertyType" value="villa" required>
                                <span>Villa</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="propertyType" value="plot" required>
                                <span>Plot</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="propertyType" value="commercial" required>
                                <span>Commercial</span>
                            </label>
                        </div>
                    </div>

                    <!-- Preferred Configuration (Conditional - Only for Apartment/Villa) -->
                    <div class="form-group" id="preferredConfigGroup" style="display: none;">
                        <label for="preferredConfiguration" class="required">Preferred Configuration</label>
                        <select id="preferredConfiguration" name="preferredConfiguration">
                            <option value="">Select configuration</option>
                            <option value="1-bhk">1 BHK</option>
                            <option value="2-bhk">2 BHK</option>
                            <option value="3-bhk">3 BHK</option>
                            <option value="4-bhk">4 BHK</option>
                        </select>
                    </div>

                    <!-- Purpose of Purchase -->
                    <div class="form-group">
                        <label for="purposeOfPurchase" class="required">Purpose of Purchase</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="purposeOfPurchase" value="self-use" required>
                                <span>Self-use</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="purposeOfPurchase" value="investment" required>
                                <span>Investment</span>
                            </label>
                        </div>
                    </div>

                    <!-- Purchase Timeline -->
                    <div class="form-group">
                        <label for="purchaseTimeline" class="required">Purchase Timeline</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="purchaseTimeline" value="immediate" required>
                                <span>Immediate (0–1 month)</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="purchaseTimeline" value="1-3-months" required>
                                <span>1–3 months</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="purchaseTimeline" value="3-6-months" required>
                                <span>3–6 months</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="purchaseTimeline" value="just-exploring" required>
                                <span>Just exploring</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-footer">
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane"></i>
                        Submit Details
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Show preferred configuration only for Apartment/Villa
        document.addEventListener('DOMContentLoaded', function () {
            const propertyTypeRadios = document.querySelectorAll('input[name="propertyType"]');
            const preferredConfigGroup = document.getElementById('preferredConfigGroup');

            propertyTypeRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (radio.value === 'apartment' || radio.value === 'villa') {
                        preferredConfigGroup.style.display = 'block';
                    } else {
                        preferredConfigGroup.style.display = 'none';
                        document.getElementById('preferredConfiguration').value = '';
                    }
                });
            });
        });
    </script>
</body>
</html>
